# Preflight — test a candidate branch "in the wild" BEFORE it reaches main.
#
# main is production: the install one-liners pull from it, so it can never break.
# This workflow installs the CANDIDATE BRANCH on fresh Windows / macOS / Linux VMs
# using the REAL, UNMODIFIED installers (install.ps1 under Windows PowerShell 5.1,
# install.sh under bash), by pointing the installers' clone URL at a local bare
# repo whose `main` ref is the candidate commit. Nothing in the sacred installers
# changes — they believe they are installing production.
#
# Scenarios:
#   fresh   — factory machine, no prior install (the new-user path)
#   upgrade — machine already running REAL production main, upgraded to the
#             candidate (the existing-user path; asserts soul/agents/.env survive)
#   fresh-nopip — Windows only: Python exists but has NO pip module (corp-managed
#             images, stripped installs — the machine class behind the v0.6.2
#             field failure). The installer must bootstrap pip itself.
#   pin-lts-fresh   — factory machine pinned to the RAPP/1 LTS kernel tag through the
#             advertised one-liner and the BRAINSTEM_VERSION variable (Windows: the
#             `irm | iex` path, which cannot pass arguments)
#   pin-lts-upgrade — machine running REAL production main, pinned to the LTS tag with
#             --version (Windows: the scriptblock form); asserts user files survive
#   Both pin legs assert the checkout IS the tag commit, the three kernel files match
#   RAPP's KERNEL_PIN.json SHA-256 values and the tag's blobs byte-for-byte, and
#   /health reports the tag's version.
#
# See RELEASING.md for the full release process this belongs to.

name: preflight

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast static checks: syntax, PS 5.1 compatibility, unit tests ────────────
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          bash -n install.sh
          bash -n install.command
          bash -n community_rapp/install.sh
          bash -n rapp_brainstem/start.sh
          bash -n tests/test_installer.sh
          bash -n tests/preflight_local.sh

      # GitHub Pages serves /docs, so the ADVERTISED one-liners pull the docs/
      # mirrors, not the root installers. A release that touches an installer
      # but skips the RELEASING.md sync step ships stale bytes to real users
      # while main looks correct (happened on v0.6.4 — issue #19).
      - name: docs/ Pages mirrors in sync
        run: |
          rc=0
          for f in install.sh install.ps1 install.cmd install.command; do
            if ! cmp -s "$f" "docs/$f"; then
              echo "::error file=docs/$f::docs/$f is stale — run the RELEASING.md sync step (cp $f docs/$f)"
              rc=1
            fi
          done
          exit $rc

      - name: PowerShell parse + PS 5.1 compatibility
        shell: pwsh
        run: |
          $files = @('install.ps1', 'rapp_brainstem/start.ps1', 'community_rapp/install.ps1', 'deploy.ps1', 'tests/test_install_pin.ps1')
          $bad = $false
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)" }; $bad = $true }
            else { Write-Host "parse ok: $f" }
          }
          if ($bad) { exit 1 }
          # Windows PowerShell 5.1 is what real users run — reject PS7-only syntax.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') } } }
          $findings = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings $settings }
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings | Where-Object RuleName -eq 'PSUseCompatibleSyntax') { exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: python compile + unit tests
        working-directory: rapp_brainstem
        run: |
          python -m py_compile brainstem.py local_storage.py tests/soul_hash.py agents/*.py
          pip install -q -r requirements.txt pytest
          python -m pytest tests/ -q

      # Must run AFTER setup-python + pip install — the suite imports brainstem
      # (flask, requests, dotenv) and runs pytest itself.
      - name: installer test suite
        run: bash tests/test_installer.sh

  # ── Real installs on fresh VMs, both platforms, fresh + upgrade ─────────────
  e2e:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        scenario: [fresh, upgrade, pin-lts-fresh, pin-lts-upgrade]
        include:
          - os: windows-latest
            scenario: fresh-nopip
    runs-on: ${{ matrix.os }}
    env:
      SCENARIO: ${{ matrix.scenario }}
      # The RAPP/1 LTS kernel: kody-w/RAPP's KERNEL_PIN.json pins
      # kody-w/rapp-installer@brainstem-v0.6.9 (its frozen SHA-256s are asserted below).
      LTS_TAG: brainstem-v0.6.9
      LTS_COMMIT: bded0e1d5044d293f465e3850758f4b012d95078
      LTS_VERSION: 0.6.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # upgrade scenario needs real origin/main as the baseline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Recreate the machine class behind the v0.6.2 field failure (2026-07-02):
      # Python is present and healthy but `python -m pip` fails with "No module
      # named pip". Without a pip bootstrap the installer dies at `import requests`
      # and the server never binds 7071 — this leg is red on v0.6.2 bytes.
      - name: strip pip from Python (fresh-nopip)
        if: matrix.scenario == 'fresh-nopip'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pip uninstall -y pip 2>&1 | Out-String | Write-Host
          python -m pip --version 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { Write-Host 'strip failed — pip still importable'; exit 1 }
          Write-Host 'pip stripped: python -m pip now fails, as on the field machine'
          exit 0

      # The fake origin: a bare repo whose `main` IS the candidate commit.
      # url.insteadOf makes the unmodified installers clone/fetch it instead of GitHub.
      - name: point installers at the candidate (fake origin)
        shell: bash
        run: |
          set -euxo pipefail
          BARE="$RUNNER_TEMP/fake-origin.git"
          git clone --bare . "$BARE"
          git -C "$BARE" update-ref refs/heads/main "$GITHUB_SHA"
          git -C "$BARE" symbolic-ref HEAD refs/heads/main
          # Preserve the real production tip so the upgrade scenario can start there.
          git -C "$BARE" update-ref refs/heads/production-baseline "$(git rev-parse origin/main)"
          BARE_URL="file://$(echo "$BARE" | sed 's|\\|/|g; s|^\([A-Za-z]\):|/\1:|')"
          git config --global "url.${BARE_URL}.insteadOf" "https://github.com/kody-w/rapp-installer.git"
          echo "BARE=$BARE" >> "$GITHUB_ENV"
          # Pinned installs resolve release tags against this origin, so it must carry them.
          case "$SCENARIO" in
            pin-lts-*)
              test "$(git --git-dir="$BARE" rev-parse --verify "refs/tags/$LTS_TAG^{commit}")" = "$LTS_COMMIT" \
                || { echo "::error::fake origin does not carry $LTS_TAG at $LTS_COMMIT"; exit 1; } ;;
          esac

      - name: seed existing production install (upgrade only)
        if: matrix.scenario == 'upgrade' || matrix.scenario == 'pin-lts-upgrade'
        shell: bash
        run: |
          set -euxo pipefail
          git clone "$BARE" "$HOME/.brainstem/src"
          git -C "$HOME/.brainstem/src" reset --hard origin/production-baseline
          # A real user's fingerprints: custom agent, edited soul, edited .env
          cat > "$HOME/.brainstem/src/rapp_brainstem/agents/preflight_custom_agent.py" <<'EOF'
          from agents.basic_agent import BasicAgent
          class PreflightCustomAgent(BasicAgent):
              def __init__(self):
                  self.name = 'PreflightCustom'
                  self.metadata = {"name": self.name, "description": "preflight marker agent",
                                   "parameters": {"type": "object", "properties": {}, "required": []}}
                  super().__init__(name=self.name, metadata=self.metadata)
              def perform(self, **kwargs):
                  return "preflight-marker"
          EOF
          echo "" >> "$HOME/.brainstem/src/rapp_brainstem/soul.md"
          echo "PREFLIGHT-SOUL-MARKER" >> "$HOME/.brainstem/src/rapp_brainstem/soul.md"
          printf 'GITHUB_MODEL=auto\nPORT=7071\n# PREFLIGHT-ENV-MARKER\n' > "$HOME/.brainstem/src/rapp_brainstem/.env"

      # Auth + remote-version checks must fail FAST and GRACEFULLY (that graceful
      # degradation is itself part of what we're testing). Black-hole the endpoints.
      - name: block network auth endpoints (unix)
        if: runner.os != 'Windows'
        run: printf '127.0.0.1 github.com\n127.0.0.1 raw.githubusercontent.com\n' | sudo tee -a /etc/hosts

      - name: block network auth endpoints (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 github.com", "127.0.0.1 raw.githubusercontent.com"

      - name: run the real installer (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -x
          # Pin legs feed the candidate bytes through the advertised one-liner shapes:
          # `curl … | BRAINSTEM_VERSION=v0.6.9 bash` and `curl … | bash -s -- --version …`.
          case "$SCENARIO" in
            pin-lts-fresh)   set -- bash -c "cat install.sh | BRAINSTEM_VERSION=v$LTS_VERSION bash" ;;
            pin-lts-upgrade) set -- bash -c "cat install.sh | bash -s -- --version $LTS_TAG" ;;
            *)               set -- bash install.sh ;;
          esac
          # `script` allocates a pty — the installer launches the server exactly as
          # it would in a user's terminal. Run it in the background and poll below.
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q "$RUNNER_TEMP/install.log" "$@" &
          else
            script -qec "$(printf '%q ' "$@")" "$RUNNER_TEMP/install.log" &
          fi
          echo $! > "$RUNNER_TEMP/installer.pid"

      - name: run the real installer (windows, PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Same execution path as `irm | iex` (script text through iex, no
          # $PSCommandPath) — but only a tiny bootstrap is encoded: base64 of the
          # whole installer would blow the 32,767-char command-line limit.
          # Launch through cmd's own file redirection: every descendant (pip, the
          # server) inherits real writable file handles. Start-Process handle
          # redirection left grandchildren blocked on console/handle semantics in
          # the consoleless CI session and the install hung silently.
          $src = "(Get-Content -Raw -Encoding UTF8 '$PWD\install.ps1')"
          switch ($env:SCENARIO) {
            # `$env:BRAINSTEM_VERSION = '0.6.9'; irm … | iex` — the one-liner cannot pass arguments.
            'pin-lts-fresh'   { $boot = "`$env:BRAINSTEM_VERSION = '$env:LTS_VERSION'; iex $src" }
            # `& ([scriptblock]::Create((irm …))) --version brainstem-v0.6.9`
            'pin-lts-upgrade' { $boot = "& ([scriptblock]::Create($src)) --version $env:LTS_TAG" }
            default           { $boot = "iex $src" }
          }
          Write-Host "bootstrap: $boot"
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($boot))
          Start-Process cmd -ArgumentList '/c',"powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $enc > `"$env:RUNNER_TEMP\install.log`" 2>&1"

      - name: wait for a serving brainstem, then assert
        shell: bash
        run: |
          set -uo pipefail
          # Pin legs must serve the pinned release; every other leg serves the candidate.
          case "$SCENARIO" in
            pin-lts-*) EXPECT_VERSION="$LTS_VERSION" ;;
            *)         EXPECT_VERSION="$(tr -d '[:space:]' < rapp_brainstem/VERSION)" ;;
          esac
          for i in $(seq 1 120); do
            sleep 5
            if curl -sf "http://localhost:7071/health" -o "$RUNNER_TEMP/health.json"; then break; fi
            if [ "$i" = 120 ]; then echo "server never came up"; cat "$RUNNER_TEMP/install.log" 2>/dev/null | tail -60; exit 1; fi
          done
          cat "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" "$EXPECT_VERSION" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("status") in ("ok", "unauthenticated"), d
          assert d.get("version") == sys.argv[2], f'server v{d.get("version")} != expected v{sys.argv[2]}'
          assert "ContextMemory" in (d.get("agents") or []), d.get("agents")
          print("health OK:", d.get("status"), "v" + d.get("version"))
          EOF
          # The web UI must serve, and /chat must fail as JSON, never crash.
          # Fetch to a file first — `curl | grep -q` SIGPIPEs curl (grep closes the
          # pipe on match) and Actions' default `set -o pipefail` would flag it.
          curl -sf http://localhost:7071/ -o "$RUNNER_TEMP/index.html"
          grep -q "RAPP Brainstem" "$RUNNER_TEMP/index.html"
          curl -sf http://localhost:7071/models >/dev/null
          curl -s -X POST http://localhost:7071/chat -H 'Content-Type: application/json' \
            -d '{"user_input":"preflight ping"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('chat contract OK:', list(d)[:3])"

      # The LTS pin must land exactly: the installed checkout IS the tag commit (detached,
      # so no pull can move it) and the kernel files are the tag's bytes, even where git
      # checks text out as CRLF (Git for Windows' core.autocrlf=true default).
      - name: assert the pinned LTS kernel (pin-lts only)
        if: startsWith(matrix.scenario, 'pin-lts')
        shell: bash
        run: |
          set -euo pipefail
          SRC="$HOME/.brainstem/src"
          HEAD_COMMIT="$(git -C "$SRC" rev-parse HEAD)"
          TAG_COMMIT="$(git --git-dir="$BARE" rev-parse --verify "refs/tags/$LTS_TAG^{commit}")"
          echo "installed HEAD $HEAD_COMMIT; $LTS_TAG = $TAG_COMMIT"
          test "$TAG_COMMIT" = "$LTS_COMMIT" || { echo "::error::$LTS_TAG is not $LTS_COMMIT"; exit 1; }
          test "$HEAD_COMMIT" = "$LTS_COMMIT" || { echo "::error::installed checkout is not $LTS_TAG"; exit 1; }
          if git -C "$SRC" symbolic-ref -q HEAD; then echo "::error::pinned checkout is on a branch"; exit 1; fi
          git -C "$SRC" config --show-origin --get core.autocrlf || echo "core.autocrlf unset"
          python3 - "$SRC" "$BARE" <<'EOF'
          import hashlib, os, subprocess, sys
          src, bare, tag = sys.argv[1], sys.argv[2], os.environ["LTS_TAG"]
          # kody-w/RAPP KERNEL_PIN.json, kernel.frozen (grail kody-w/rapp-installer@brainstem-v0.6.9)
          frozen = {
              "rapp_brainstem/brainstem.py": "a293dd9f11eef915bf15776f08c736faa60cb749820871b6753ea98233142a71",
              "rapp_brainstem/agents/basic_agent.py": "701488bc00d536a7b23295e7da99c62f24e9b00f233daa325886430c736b78eb",
              "rapp_brainstem/VERSION": "13eb74b44be6e3a85a0efa0dedf56aec05e9e50140e1c8bbc0d0fbd8097b0717",
          }
          for path, want in frozen.items():
              blob = subprocess.run(["git", "--git-dir=" + bare, "cat-file", "blob", tag + ":" + path],
                                    check=True, capture_output=True).stdout
              disk = open(os.path.join(src, path), "rb").read()
              print(path, "installed", hashlib.sha256(disk).hexdigest(), "tag blob", hashlib.sha256(blob).hexdigest())
              assert hashlib.sha256(blob).hexdigest() == want, path + ": tag blob does not match KERNEL_PIN.json"
              assert disk == blob, path + ": installed bytes differ from " + tag
          # Evidence of what the kernel sync had to undo on this runner: a non-kernel file
          # from the same checkout shows whether git wrote CRLF here.
          other = open(os.path.join(src, "rapp_brainstem", "index.html"), "rb").read()
          print("non-kernel rapp_brainstem/index.html has CRLF:", b"\r\n" in other)
          print("kernel byte-exact at", tag)
          EOF

      - name: assert user files survived the upgrade
        if: matrix.scenario == 'upgrade' || matrix.scenario == 'pin-lts-upgrade'
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$HOME/.brainstem/src/rapp_brainstem/agents/preflight_custom_agent.py"
          grep -q "PREFLIGHT-SOUL-MARKER" "$HOME/.brainstem/src/rapp_brainstem/soul.md"
          grep -q "PREFLIGHT-ENV-MARKER" "$HOME/.brainstem/src/rapp_brainstem/.env"
          curl -sf http://localhost:7071/health | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          assert 'PreflightCustom' in (d.get('agents') or []), d.get('agents')
          print('custom agent survived upgrade')"

      # A pin that names no release (or a bare --version) must be refused with a clear
      # message BEFORE anything changes: same commit, no new stash of the user's edits,
      # same soul. Run against the pinned install left by the leg above.
      - name: bad pins are refused and change nothing (pin-lts-upgrade, unix)
        if: matrix.scenario == 'pin-lts-upgrade' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$HOME/.brainstem/src"
          state() { echo "$(git -C "$SRC" rev-parse HEAD) $(git -C "$SRC" stash list | wc -l) $(git -C "$SRC" hash-object rapp_brainstem/soul.md)"; }
          BEFORE="$(state)"
          refused() {  # refused <expected message> <installer args...>
            local want="$1" rc=0 out
            shift
            out="$(bash install.sh "$@" </dev/null 2>&1)" || rc=$?
            echo "$out" | tail -4
            test "$rc" -ne 0 || { echo "::error::'$*' was not refused"; exit 1; }
            grep -q "$want" <<<"$out" || { echo "::error::'$*' gave no clear refusal"; exit 1; }
            test "$(state)" = "$BEFORE" || { echo "::error::'$*' changed the install"; exit 1; }
          }
          refused "Version 9.9.9 not found" --version 9.9.9
          refused "needs a value" --version
          echo "bad pins refused; install unchanged: $BEFORE"

      - name: bad pins are refused and change nothing (pin-lts-upgrade, windows)
        if: matrix.scenario == 'pin-lts-upgrade' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $src = "$env:USERPROFILE\.brainstem\src"
          function Get-InstallState {
              "$(git -C $src rev-parse HEAD) $(@(git -C $src stash list).Count) $((Get-FileHash "$src\rapp_brainstem\soul.md").Hash)"
          }
          $before = Get-InstallState
          function Assert-Refused {
              param([string]$Want, [string[]]$InstallerArgs)
              $out = & powershell -NoProfile -ExecutionPolicy Bypass -File "$PWD\install.ps1" @InstallerArgs 2>&1 | Out-String
              $code = $LASTEXITCODE
              ($out -split "`n" | Select-Object -Last 6) -join "`n" | Write-Host
              if ($code -eq 0) { Write-Host "::error::'$InstallerArgs' was not refused"; exit 1 }
              if ($out -notmatch $Want) { Write-Host "::error::'$InstallerArgs' gave no clear refusal"; exit 1 }
              if ((Get-InstallState) -ne $before) { Write-Host "::error::'$InstallerArgs' changed the install"; exit 1 }
          }
          Assert-Refused -Want 'Version 9\.9\.9 not found' -InstallerArgs @('--version', '9.9.9')
          Assert-Refused -Want 'needs a value' -InstallerArgs @('--version')
          Write-Host "bad pins refused; install unchanged: $before"
          exit 0

      - name: collect installer log
        if: always()
        shell: bash
        run: |
          echo "── install.log ──"; tail -100 "$RUNNER_TEMP/install.log" 2>/dev/null || true
          echo "── install.err ──"; tail -40 "$RUNNER_TEMP/install.err" 2>/dev/null || true

      # If the install wedges, show exactly which process is stuck and on what.
      - name: diagnose processes (windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match 'python|pip|powershell|pwsh|cmd|gh|winget|git' } |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-List | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ matrix.os }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/install.*
          if-no-files-found: ignore
